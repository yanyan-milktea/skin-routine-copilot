name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-evals:
    name: Type check and synthetic evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      NEXT_PUBLIC_AI_API_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:codex

      - name: Run synthetic evals
        run: npm run evals
